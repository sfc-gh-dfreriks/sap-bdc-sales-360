spec:
  containers:
  - name: sales360
    image: /sc360_app_provider/images/repo/sales_360:latest
    env:
      PORT: "8080"
    resources:
      requests:
        memory: 2Gi
        cpu: 1000m
      limits:
        memory: 4Gi
        cpu: 2000m
    readinessProbe:
      port: 8080
      path: /healthcheck
  endpoints:
  - name: sales360
    port: 8080
    public: true
serviceRoles:
- name: sales_360_role
  endpoints:
  - sales360
